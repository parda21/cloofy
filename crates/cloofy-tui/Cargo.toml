[package]
name = "cloofy-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The terminal interface of cloofy"

# The music services built in. Without any, only the demo runs.
[features]
default = ["spotify", "ytmusic"]
spotify = ["dep:cloofy-spotify", "dep:cloofy-player", "dep:librespot"]
ytmusic = ["dep:cloofy-ytmusic"]

[dependencies]
cloofy-core.workspace = true
cloofy-spotify = { workspace = true, optional = true }
cloofy-player = { workspace = true, optional = true }
cloofy-ytmusic = { workspace = true, optional = true }
cloofy-os.workspace = true
librespot = { workspace = true, optional = true }
anyhow.workspace = true
base64.workspace = true
crossterm.workspace = true
fontdue.workspace = true
futures.workspace = true
icy_sixel.workspace = true
image.workspace = true
nucleo-matcher.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tachyonfx.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
toml.workspace = true
toml_edit.workspace = true
