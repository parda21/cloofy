[workspace]
resolver = "3"
members = ["crates/*"]
# The forks are workspaces of their own, so their tests run from inside vendor/.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/parda21/cloofy"

[workspace.dependencies]
cloofy-spotify = { path = "crates/cloofy-spotify" }
cloofy-player = { path = "crates/cloofy-player" }
cloofy-tui = { path = "crates/cloofy-tui" }

# librespot-core 0.8 fails to build with vergen 9.1, so Cargo.lock pins vergen 9.0.6.
# Keep that pin when running `cargo update` (`cargo update -p vergen --precise 9.0.6`).
librespot = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots", "rodio-backend"] }

anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
fontdue = "0.9"
futures = "0.3"
iana-time-zone = "0.1"
# Covers come as JPEG, some as WebP; PNG is for F12 snapshots. The default formats would
# also link an AV1 encoder, EXR and TIFF, which cloofy never decodes.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
nucleo-matcher = "0.3"
open = "5"
protobuf = "3"
rand = "0.10"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tachyonfx = "0.25"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url = "2"

# vendor/ holds forks as git submodules, both on branch `cloofy`:
# - librespot (github.com/parda21/librespot) with two open upstream PRs merged, DJ with
#   narration (librespot-org/librespot#1797) and crossfade (#1756), plus fixes on top.
# - ratatui-image (github.com/parda21/ratatui-image), which frees Kitty image uploads once sent.
[patch.crates-io]
librespot = { path = "vendor/librespot" }
librespot-audio = { path = "vendor/librespot/audio" }
librespot-connect = { path = "vendor/librespot/connect" }
librespot-core = { path = "vendor/librespot/core" }
librespot-discovery = { path = "vendor/librespot/discovery" }
librespot-metadata = { path = "vendor/librespot/metadata" }
librespot-oauth = { path = "vendor/librespot/oauth" }
librespot-playback = { path = "vendor/librespot/playback" }
librespot-protocol = { path = "vendor/librespot/protocol" }
ratatui-image = { path = "vendor/ratatui-image" }

# Thin LTO with one codegen unit gives a smaller binary whose hot code sits on fewer pages.
# Fat LTO would add minutes to `cargo install` (librespot, aws-lc) for little more. Panics
# keep unwinding, so one in a background task (say, decoding a broken cover) fails only that
# task instead of the whole app.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
