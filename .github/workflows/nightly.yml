name: Nightly

# YouTube Music as it answers today: cloofy-ytmusic's tests against the live catalog, which
# ordinary runs leave out. A failure here means InnerTube changed, and the parsers need to catch up
# before people notice. Streams aren't tested here: YouTube asks yt-dlp to sign in from GitHub's
# addresses, so that test only runs from home (see CONTRIBUTING.md).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  youtube-music:
    name: YouTube Music, live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cargo.toml patches librespot and ratatui-image with them.
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: nightly
      - run: cargo test -p cloofy-ytmusic --locked --test live -- --ignored
