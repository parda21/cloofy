name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The default features, both services: the full build.
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh

  # The other builds: each service on its own, and none, where only `cloofy demo` works. The
  # features go to every crate that has them, cloofy and cloofy-tui among them.
  features:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: spotify, id: spotify, features: --no-default-features --features spotify }
          - { name: ytmusic, id: ytmusic, features: --no-default-features --features ytmusic }
          - { name: no services, id: none, features: --no-default-features }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      # Every workspace crate builds, cloofy-player too, whatever the features.
      - name: Install audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.id }}
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace --locked ${{ matrix.features }}

  # The same builds on macOS, where they are released too. Checked only, without the tests, which
  # keeps the minutes down: the tests run on Linux above, and the full build's on both.
  features-macos:
    name: ${{ matrix.name }} (macOS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: spotify, id: spotify, features: --no-default-features --features spotify }
          - { name: ytmusic, id: ytmusic, features: --no-default-features --features ytmusic }
          - { name: no services, id: none, features: --no-default-features }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.id }}
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings

  # Installs must not carry the service they weren't made for: what cloofy depends on with
  # each set of features, on every platform.
  no-bloat:
    name: no bloat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Cargo.toml patches librespot and ratatui-image with them.
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Each build depends only on its services
        run: |
          # Fails when cloofy with `features` depends on a crate matching `unwanted`, or when
          # cloofy-tui doesn't have exactly `features` on. cloofy depends on a service's crate
          # itself too, so only cloofy-tui's features show that the interface has the service.
          only() {
            local features=$1 unwanted=$2 deps found tui
            deps=$(cargo tree --package cloofy --locked --edges normal --target all --prefix none \
              --no-default-features ${features:+--features "$features"}) || return 1
            found=$(grep -E "$unwanted" <<<"$deps" | sort -u || true)
            if [ -n "$found" ]; then
              echo "::error::With features '${features:-none}', cloofy depends on:"
              echo "$found"
              return 1
            fi
            tui=$(cargo tree --package cloofy --locked --edges features --invert cloofy-tui --target all \
              --prefix none --no-default-features ${features:+--features "$features"}) || return 1
            tui=$(sed -n 's/^cloofy-tui feature "\(.*\)"$/\1/p' <<<"$tui" | sort -u | paste -sd , -)
            if [ "$tui" != "$features" ]; then
              echo "::error::With features '${features:-none}', cloofy-tui has '${tui:-none}' on"
              return 1
            fi
            echo "Features '${features:-none}': cloofy-tui has the same, and nothing matches $unwanted"
          }
          status=0
          # Spotify's player is the only thing that plays through ALSA or PulseAudio.
          only ytmusic '^(librespot|cloofy-spotify|cloofy-player|alsa-sys|libpulse)' || status=1
          only spotify '^cloofy-ytmusic ' || status=1
          only "" '^(librespot|cloofy-spotify|cloofy-player|cloofy-ytmusic )' || status=1
          exit $status

  # Known advisories, crate sources and bans, per deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Cargo.toml patches librespot and ratatui-image with them.
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: shellcheck packaging/*.sh
      - run: packaging/check.sh
