name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds everything without publishing, to try out changes to this workflow.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev
      - run: cargo build --release --locked --package cloofy --target ${{ matrix.target }}
      - name: Package
        run: |
          archive=cloofy-${{ matrix.target }}.tar.gz
          cp target/${{ matrix.target }}/release/cloofy .
          tar -czf "$archive" cloofy LICENSE README.md
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cloofy-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --title "cloofy $version" --notes-file notes.md
