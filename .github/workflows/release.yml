name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds everything without publishing, to try out changes to this workflow.
  workflow_dispatch:

# The builds run every crate's build script, so only the jobs that publish can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binaries run on older glibc too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev
      # One build per service set, one after another in the same target folder: the three
      # share their dependencies, so the second and third compile little but cloofy itself.
      - name: Build spotify, ytmusic and full
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for variant in spotify ytmusic full; do
            case "$variant" in
              spotify) features=spotify ;;
              ytmusic) features=ytmusic ;;
              full) features=spotify,ytmusic ;;
            esac
            cargo build --release --locked --package cloofy --target "$TARGET" \
              --no-default-features --features "$features"
            mkdir -p "dist/$variant"
            cp "target/$TARGET/release/cloofy" "dist/$variant/"
          done
      # A build that runs here says which services it has; the Linux ones also show what they
      # link. The YouTube Music build must not need ALSA or PulseAudio, which only Spotify uses.
      - name: Check each build has its services, and only those
        env:
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          for variant in spotify ytmusic full; do
            binary="dist/$variant/cloofy"
            if [ "$host" = "$TARGET" ]; then
              version=$("$binary" --version)
              echo "$variant: $version"
              case "$variant:$version" in
                spotify:*spotify*ytmusic* | spotify:*ytmusic*spotify* | ytmusic:*spotify*) ok=false ;;
                spotify:*spotify* | ytmusic:*ytmusic* | full:*spotify*ytmusic* | full:*ytmusic*spotify*) ok=true ;;
                *) ok=false ;;
              esac
              if ! $ok; then
                echo "::error::The $variant build says: $version"
                exit 1
              fi
            fi
            if [ "$RUNNER_OS" = Linux ]; then
              libraries=$(readelf -d "$binary" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tr '\n' ' ')
              echo "$variant links: $libraries"
              if [ "$variant" = ytmusic ] && grep -Eq 'libasound|libpulse' <<<"$libraries"; then
                echo "::error::The ytmusic build links ALSA or PulseAudio: $libraries"
                exit 1
              fi
            fi
          done
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for variant in spotify ytmusic full; do
            archive="cloofy-$variant-$TARGET.tar.gz"
            cp LICENSE README.md "dist/$variant/"
            tar -czf "$archive" -C "dist/$variant" cloofy LICENSE README.md
            shasum -a 256 "$archive" > "$archive.sha256"
          done
          # cloofy 0.4 and older update themselves from this name, and play Spotify.
          cp "cloofy-spotify-$TARGET.tar.gz" "cloofy-$TARGET.tar.gz"
          shasum -a 256 "cloofy-$TARGET.tar.gz" > "cloofy-$TARGET.tar.gz.sha256"
          ls -l cloofy-*.tar.gz*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: cloofy-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --title "cloofy $version" --notes-file notes.md

  packages:
    name: Homebrew and AUR
    needs: publish
    permissions:
      contents: write
    # Package managers get releases, not previews such as v0.4.0-beta.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill in the formulas and PKGBUILDs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern '*.sha256' --dir checksums
          packaging/render.sh "${TAG#v}" checksums packages
      # Until cloofy is in the AUR: `curl -L -o PKGBUILD …/releases/latest/download/cloofy-bin.PKGBUILD
      # && makepkg -si`. Plain `PKGBUILD` stays Spotify's, the name 0.4's instructions download.
      - name: Attach the PKGBUILDs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for package in cloofy-bin cloofy-ytmusic-bin cloofy-full-bin; do
            cp "packages/aur/$package/PKGBUILD" "$package.PKGBUILD"
          done
          cp packages/aur/cloofy-bin/PKGBUILD PKGBUILD
          gh release upload "$TAG" PKGBUILD cloofy-bin.PKGBUILD cloofy-ytmusic-bin.PKGBUILD cloofy-full-bin.PKGBUILD --clobber
      # Each skips with a notice until its secret is set, see packaging/README.md.
      - name: Push them to the tap and the AUR
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: packaging/publish.sh packages
